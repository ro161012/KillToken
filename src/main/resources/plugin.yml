name: KillToken
version: '${project.version}'
main: dev.ro161012.killtoken.KillTokenPlugin
api-version: '1.21'
prefix: KillToken
description: Drops a customizable Kill Token whenever a player kills another player, with pair-based anti-farming cooldowns.
authors: [ro161012]
website: https://github.com/ro161012/KillToken

commands:
  killtoken:
    description: Manage the Kill Token currency.
    usage: /killtoken <set|give|giveblock|reload>
    permission: killtoken.admin

permissions:
  killtoken.admin:
    description: Grants every KillToken management permission.
    default: op
    children:
      killtoken.set: true
      killtoken.give: true
      killtoken.reload: true
  killtoken.set:
    description: Allows changing the Kill Token currency item.
    default: op
  killtoken.give:
    description: Allows handing out Kill Tokens directly.
    default: op
  killtoken.reload:
    description: Allows reloading the KillToken configuration.
    default: op
