# ============================================================
#  KillToken configuration
# ============================================================

# Seconds a killer<->victim pair must wait before another token
# can drop between the same two players (in either direction).
cooldown-seconds: 60

# Number of token items dropped per qualifying kill.
tokens-per-kill: 1

# Message the killer when a drop is suppressed by the pair cooldown.
notify-on-cooldown: true
cooldown-message: "&cNo Kill Token dropped - you and this player are on cooldown."

# Message sent to the killer when a token drops. Leave empty to disable.
kill-message: "&6+1 Kill Token"

# ------------------------------------------------------------
#  Killstreaks
# ------------------------------------------------------------
# Consecutive qualifying PvP kills build a streak. Starting at 2 kills, every
# kill is announced in server chat and the streak owner alone hears the sound
# at a fixed normal pitch. Streaks reset on death (any cause) and disconnect.
killstreak:
  enabled: true
  # %player% is the killer's name; %streak% is their current streak.
  message: "&c%player% &7is on a &6%streak% &7killstreak!"
  # Any org.bukkit.Sound name. It plays only for the streak owner at pitch 1.0.
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
  # No chat or sound at streak 1. Announce every qualifying kill from 2 onward.
  announcement-minimum: 2
  # Token drops multiply from streak 3: 3-5 = 2x, 6-8 = 3x, and so on.
  # The multiplier rises every 3 kills and is capped at 5x for balance.
  reward-start: 3
  reward-step: 3
  max-token-multiplier: 5

# ------------------------------------------------------------
#  Currency item
# ------------------------------------------------------------
# The item below is dropped as the Kill Token. It is seeded with a
# named Nether Star on first launch; use /killtoken set in game to
# replace it with whatever you are holding (persisted automatically).

# ------------------------------------------------------------
#  Compressed Kill Token Block
# ------------------------------------------------------------
# A single Compressed Kill Token Block holds 64 Kill Tokens. There are
# no crafting recipes - wire the block into your own trading instead
# (e.g. custom villager trades).
compressed-blocks:
  # Material of the Compressed Kill Token Block (64 tokens).
  compressed-block-material: QUARTZ_BLOCK
