name: KillToken checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Check KillToken
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test KillToken
        run: ./mvnw -B -ntp verify

      - name: Save the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: KillToken
          path: target/KillToken-*.jar
          if-no-files-found: error

  paper-26-compatibility:
    name: Check Paper 26 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile against Paper 26
        run: ./mvnw -B -ntp -Ppaper-26 -Dmaven.test.skip=true verify

  release:
    name: Publish release files
    needs: [build, paper-26-compatibility]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get the plugin jar
        uses: actions/download-artifact@v4
        with:
          name: KillToken
          path: dist

      - name: Add the jar to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KillToken-*.jar
